<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IMAP Sync Dashboard - Professional Email Migration Tool{% endblock %}</title>
    <meta name="description"
        content="{% block description %}IMAP Sync Pro - Bulk email migration tool between IMAP servers. Supports Gmail, Office 365, and other IMAP servers.{% endblock %}">
    <meta property="og:title" content="IMAP Sync Pro - Email Migration Tool">
    <meta property="og:description"
        content="Migrate emails securely and efficiently between IMAP servers with an intuitive interface.">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css?v=9.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>

<body class="font-sans bg-gray-50 text-slate-800 transition-colors duration-300 min-h-screen flex flex-col">
    <!-- Background base -->
    <div class="fixed inset-0 -z-10 bg-slate-50 dark:bg-slate-950 pointer-events-none"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full flex flex-col">
        <!-- Header -->
        {% include "components/header.html" %}

        <!-- Main Content -->
        {% block content %}{% endblock %}
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 glass-overlay"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div
                class="relative bg-white dark:bg-slate-900 rounded-xl shadow-xl p-6 w-full max-w-md animate-slide-up border border-slate-200 dark:border-slate-800">
                <h3 id="confirm-title" class="text-lg font-semibold text-slate-900 dark:text-white mb-2">Confirm</h3>
                <p id="confirm-message" class="text-slate-600 dark:text-slate-400 mb-6">Are you sure?</p>
                <div class="flex justify-end gap-3">
                    <button
                        class="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors text-sm font-medium"
                        onclick="closeConfirm(false)">Cancel</button>
                    <button
                        class="px-4 py-2 bg-blue-600 dark:bg-blue-600 text-white rounded-lg hover:bg-blue-700 dark:hover:bg-blue-500 transition-colors shadow-sm text-sm font-medium"
                        onclick="closeConfirm(true)">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-3">
        <!-- Toasts injected here -->
    </div>

    <!-- Footer -->
    {% include "components/footer.html" %}

    <script src="/js/app.js?v=9.0"></script>
    <script>
        // Init theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeUI(savedTheme);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
            updateThemeUI('dark');
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const sunIcon = document.querySelector('.sun-icon');
            const moonIcon = document.querySelector('.moon-icon');
            if(sunIcon && moonIcon){
                if (theme === 'dark') {
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                } else {
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                }
            }
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
