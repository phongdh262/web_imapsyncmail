<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IMAP Sync Dashboard - Professional Email Migration Tool{% endblock %}</title>
    <meta name="description"
        content="{% block description %}IMAP Sync Pro - Bulk email migration tool between IMAP servers. Supports Gmail, Office 365, and other IMAP servers.{% endblock %}">
    <meta property="og:title" content="IMAP Sync Pro - Email Migration Tool">
    <meta property="og:description"
        content="Migrate emails securely and efficiently between IMAP servers with an intuitive interface.">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css?v={{ asset_version('css/style.css') }}">
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Be Vietnam Pro', 'sans-serif'],
                        mono: ['IBM Plex Mono', 'monospace'],
                    },
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>

<body data-admin-mode="{{ 'true' if admin_mode else 'false' }}" data-page="{% block page_id %}default{% endblock %}" class="font-sans bg-gray-50 text-slate-800 transition-colors duration-300 min-h-screen flex flex-col">
    <!-- Background base -->
    <div class="fixed inset-0 -z-10 bg-slate-50 dark:bg-slate-950 pointer-events-none"></div>

    <div class="app-shell py-8 flex-1 w-full flex flex-col">
        <!-- Header -->
        {% include "components/header.html" %}

        <!-- Main Content -->
        {% block content %}{% endblock %}
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 glass-overlay"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div
                class="relative bg-white dark:bg-slate-900 rounded-xl shadow-xl p-6 w-full max-w-md animate-slide-up border border-slate-200 dark:border-slate-800">
                <h3 id="confirm-title" data-i18n="modal.confirm.title" class="text-lg font-semibold text-slate-900 dark:text-white mb-2">Confirm</h3>
                <p id="confirm-message" data-i18n="modal.confirm.message" class="text-slate-600 dark:text-slate-400 mb-6">Are you sure?</p>
                <div class="flex justify-end gap-3">
                    <button
                        data-i18n="modal.confirm.cancel"
                        class="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors text-sm font-medium"
                        onclick="closeConfirm(false)">Cancel</button>
                    <button
                        data-i18n="modal.confirm.confirm"
                        class="px-4 py-2 bg-blue-600 dark:bg-blue-600 text-white rounded-lg hover:bg-blue-700 dark:hover:bg-blue-500 transition-colors shadow-sm text-sm font-medium"
                        onclick="closeConfirm(true)">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-3">
        <!-- Toasts injected here -->
    </div>

    <!-- Admin Login Modal -->
    <div id="admin-login-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 glass-overlay"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="relative bg-white dark:bg-slate-900 rounded-xl shadow-xl p-6 w-full max-w-md border border-slate-200 dark:border-slate-800">
                <div class="flex items-center justify-between gap-4 mb-5">
                    <div>
                        <h3 data-i18n="modal.admin.title" class="text-lg font-semibold text-slate-900 dark:text-white">Admin Login</h3>
                        <p data-i18n="modal.admin.subtitle" class="text-sm text-slate-500 dark:text-slate-400">Sign in to manage jobs and run credential checks.</p>
                    </div>
                    <button onclick="closeAdminLoginModal()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400" aria-label="Close admin login" data-i18n-aria-label="modal.admin.closeAria">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <form id="admin-login-form" class="space-y-4">
                    <div>
                        <label for="admin-username" data-i18n="modal.admin.username" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Username</label>
                        <input id="admin-username" name="username" type="text" autocomplete="username" class="w-full px-4 py-3 bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow" placeholder="phongdh">
                    </div>
                    <div>
                        <label for="admin-password" data-i18n="modal.admin.password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Password</label>
                        <input id="admin-password" name="password" type="password" autocomplete="current-password" data-i18n-placeholder="modal.admin.passwordPlaceholder" class="w-full px-4 py-3 bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow" placeholder="Enter admin password">
                    </div>
                    <p id="admin-login-error" class="hidden text-sm text-red-500"></p>
                    <div class="flex justify-end gap-3 pt-2">
                        <button type="button" onclick="closeAdminLoginModal()" data-i18n="modal.admin.cancel" class="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors text-sm font-medium">Cancel</button>
                        <button type="submit" id="admin-login-submit" data-i18n="modal.admin.submit" class="px-4 py-2 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 rounded-lg hover:opacity-90 transition-colors shadow-sm text-sm font-medium">Sign In</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    {% include "components/footer.html" %}

    <script src="/js/i18n.js?v={{ asset_version('js/i18n.js') }}"></script>
    <script src="/js/app.js?v={{ asset_version('js/app.js') }}"></script>
    <script>
        window.showAdminLoginModal = window.showAdminLoginModal || function () {
            const modal = document.getElementById('admin-login-modal');
            const usernameInput = document.getElementById('admin-username');
            if (!modal) return;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            if (usernameInput) {
                setTimeout(() => usernameInput.focus(), 0);
            }
        };

        window.closeAdminLoginModal = window.closeAdminLoginModal || function () {
            const modal = document.getElementById('admin-login-modal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        document.addEventListener('click', function (event) {
            const trigger = event.target.closest('[data-admin-login-trigger]');
            if (!trigger) return;
            event.preventDefault();
            window.showAdminLoginModal();
        });

        // Init theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeUI(savedTheme);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
            updateThemeUI('dark');
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const sunIcon = document.querySelector('.sun-icon');
            const moonIcon = document.querySelector('.moon-icon');
            if(sunIcon && moonIcon){
                if (theme === 'dark') {
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                } else {
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                }
            }
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
